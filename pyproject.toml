[project]
name = "ecrivez"
dynamic = ["version"]
description = "A medical secretary in the terminal: dictate roughly, get a clean note."
readme = "README.md"
authors = [{ name = "Matias Ceau", email = "matias@ceau.net" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ecrivez = "ecrivez.cli:main"
ecrivez-gui = "ecrivez.gui:main"
ecrivez-web = "ecrivez.web:main"

[tool.hatch.version]
path = "src/ecrivez/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
